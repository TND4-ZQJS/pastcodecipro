<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI Pro - WhatsApp Document Checklist</title>
    <style>
        /* ============================================================
            GLOBAL DESIGN VARIABLES (Unified Workspace Framework)
           ============================================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --nav-height: 52px;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --bg: #f5f5f7;       /* Clean gray workspace canvas background */
            --surface: #ffffff;  /* Card surface background */
            --text-primary: #1d1d1f;
            --text-secondary: #515154;
            --text-tertiary: #86868b;
            --border: rgba(0, 0, 0, 0.06);
            --line: #e9e9ee;
        }
        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }
        .container { max-width: 940px; margin: 20px auto 40px; padding: 0 24px 20px; }

        /* ============================================================
            PREMIUM iOS BACK NAVIGATION ENGINE
           ============================================================ */
        .back-navigation-container { max-width: 940px; margin: 20px auto 0 auto; padding: 0 24px; display: flex; align-items: center; }
        a.back-link, a.back-link span { text-decoration: none !important; border-bottom: none !important; box-shadow: none !important; outline: none !important; }
        a.back-link {
            display: inline-flex; align-items: center; gap: 2px; color: #007aff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            font-size: 16px; font-weight: 400; letter-spacing: -0.3px; transition: opacity 0.15s ease; cursor: pointer; -webkit-user-select: none; user-select: none;
        }
        a.back-link:hover { opacity: 0.7; }
        a.back-link:active { opacity: 0.3; }
        a.back-link svg { margin-left: -6px; transform: translateY(0.5px); stroke: #007aff !important; fill: none; }

        /* ============================================================
            APPLE-STYLE CARD & CHECKLIST MODULE
           ============================================================ */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }
        .header-title { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-primary); margin-bottom: 6px; }
        .header-subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; }
        
        .checklist-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
        .check-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
            user-select: none;
        }
        .check-item:hover { background: #ececef; border-color: rgba(0, 0, 0, 0.1); }
        .check-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .check-item span { font-size: 15px; color: var(--text-primary); font-weight: 400; }

        .output-label { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px; display: block; }
        textarea.preview-box {
            width: 100%;
            height: 220px;
            background: #fafafa;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 14px;
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 13px;
            color: var(--text-primary);
            resize: vertical;
            outline: none;
            line-height: 1.45;
        }
        textarea.preview-box:focus { border-color: var(--accent); }

        .action-row { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; gap: 12px; }
        .btn-copy {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 980px;
            padding: 10px 22px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s ease, opacity 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-copy:hover { background-color: var(--accent-hover); }
        .btn-copy:active { opacity: 0.7; }

        .toast-msg {
            font-size: 14px;
            font-weight: 500;
            color: #34c759;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .toast-msg.visible { opacity: 1; }
    </style>
</head>
<body>

    <!-- iOS Back Navigation -->
    <div class="back-navigation-container">
        <a href="javascript:history.back()" class="back-link">
            <svg width="21" height="21" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span>Back</span>
        </a>
    </div>

    <!-- Main Workspace Container -->
    <div class="container">
        <div class="card">
            <h1 class="header-title">Document Checklist</h1>
            <p class="header-subtitle">Select the required items to compile a formatted text list for WhatsApp.</p>

            <!-- Checklist Inputs -->
            <div class="checklist-grid" id="checklistGrid">
                <label class="check-item">
                    <input type="checkbox" data-has-colon="false" value="Malaysia IC Copy (PDF/Image format)">
                    <span>Malaysia IC Copy (PDF/Image format)</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" data-has-colon="false" value="Passport Copy (PDF/Image format)">
                    <span>Passport Copy (PDF/Image format)</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" data-has-colon="false" value="Visa Copy (PDF/Image format)">
                    <span>Visa Copy (PDF/Image format)</span>
                </label>
                  <label class="check-item">
                    <input type="checkbox" data-has-colon="false" value="Marriage Certificate Copy (PDF/Image format)">
                    <span>Marriage Certificate Copy (PDF/Image format)</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" data-has-colon="true" value="TIN No. / SG Work Pass No.">
                    <span>TIN No. / SG Work Pass No.</span>
                </label>
                  <label class="check-item">
                    <input type="checkbox" data-has-colon="true" value="Home Address">
                    <span>Home Address</span>
                </label>
                  <label class="check-item">
                    <input type="checkbox" data-has-colon="true" value="Company Name">
                    <span>Company Name</span>
                </label>
                  <label class="check-item">
                    <input type="checkbox" data-has-colon="true" value="Company Address">
                    <span>Company Address</span>
                </label>
                  <label class="check-item">
                    <input type="checkbox" data-has-colon="true" value="Occupation">
                    <span>Occupation</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" data-has-colon="true" value="Email Address">
                    <span>Email Address</span>
                </label>
                <!-- Multi-field structured item -->
                  <label class="check-item">
                    <input type="checkbox" data-subitems='["Bank Name", "Account Number"]' value="E Banking Info (for claims)">
                    <span>E Banking Info (for claims)</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" data-subitems='["Bank Name", "Card Number", "Expiry Date (MM/YY)"]' value="Credit / Debit Card Info">
                    <span>Credit / Debit Card Info</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" data-has-colon="true" value="Height(cm)and Weight(kg)">
                    <span>Height(cm)and Weight(kg)</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" data-has-colon="true" value="Length(cm)and Weight(kg)">
                    <span>Length(cm)and Weight(kg)</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" data-has-colon="true" value="Any health condition (past and current)">
                    <span>Any health condition (past and current)</span>
                </label>
            </div>

            <!-- Preview Output -->
            <label for="previewBox" class="output-label">WhatsApp Text Preview:</label>
            <textarea id="previewBox" class="preview-box" readonly></textarea>

            <!-- Actions -->
            <div class="action-row">
                <button class="btn-copy" onclick="copyWhatsAppText()">
                    Copy Text for WhatsApp
                </button>
                <span id="toastMsg" class="toast-msg">✓ Copied to clipboard</span>
            </div>
        </div>
    </div>

    <script>
        const checkboxes = document.querySelectorAll('#checklistGrid input[type="checkbox"]');
        const previewBox = document.getElementById('previewBox');
        const toastMsg = document.getElementById('toastMsg');

        function updatePreview() {
            const selectedNodes = Array.from(checkboxes).filter(cb => cb.checked);

            if (selectedNodes.length === 0) {
                previewBox.value = "Please select at least one document from the checklist above.";
                return;
            }

            let text = "Hi,\n\nKindky provide the following document(s) / details for CI Pro application:\n\n";
            
            selectedNodes.forEach((cb, index) => {
                const subitemsAttr = cb.getAttribute('data-subitems');
                
                if (subitemsAttr) {
                    // Render parent title with bulleted sub-fields underneath
                    const subitems = JSON.parse(subitemsAttr);
                    text += `${index + 1}. ${cb.value}\n`;
                    subitems.forEach(sub => {
                        text += `   - ${sub} :\n`;
                    });
                } else {
                    // Standard single line item
                    const addColon = cb.getAttribute('data-has-colon') === 'true';
                    const colonSuffix = addColon ? ' :' : '';
                    text += `${index + 1}. ${cb.value}${colonSuffix}\n`;
                }
            });

            text += "\nThank you!";
            previewBox.value = text;
        }

        checkboxes.forEach(cb => cb.addEventListener('change', updatePreview));
        updatePreview();

        function copyWhatsAppText() {
            if (previewBox.value.startsWith("Please select")) {
                alert("Please select at least one item first.");
                return;
            }

            navigator.clipboard.writeText(previewBox.value).then(() => {
                toastMsg.classList.add('visible');
                setTimeout(() => {
                    toastMsg.classList.remove('visible');
                }, 2500);
            });
        }
    </script>
</body>
</html>
